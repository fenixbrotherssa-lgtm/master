<style>
    :root {
        --hotel-blue: #1a365d;
        --hotel-gold: #c5a059;
        --hotel-bg: #e0e0e4;
        --hotel-shadow-dark: #bebebe;
        --hotel-shadow-light: #ffffff;
        --hotel-danger: #e74c3c;
    }

    * { box-sizing: border-box; }

    .modulo-container { 
        padding: 40px; 
        color: #2c3e50; 
        max-width: 1600px; 
        margin: 0 auto;
    }

    /* HEADER */
    .header-modulo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        gap: 20px;
    }

    .header-left { display: flex; align-items: center; gap: 20px; }

    .header-modulo h2 {
        font-size: 1.5rem;
        color: var(--hotel-blue);
        letter-spacing: 2px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
    }

    /* BOTONES NEOMÓRFICOS */
    .btn-neo {
        padding: 12px 25px;
        border: none;
        border-radius: 15px;
        background: var(--hotel-bg);
        box-shadow: 6px 6px 12px var(--hotel-shadow-dark), -6px -6px 12px var(--hotel-shadow-light);
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 800;
        color: var(--hotel-blue);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        text-decoration: none;
    }

    .btn-neo i { font-size: 1.1rem; }

    .btn-neo:hover {
        box-shadow: 2px 2px 5px var(--hotel-shadow-dark), -2px -2px 5px var(--hotel-shadow-light);
        transform: translateY(-1px);
    }

    .btn-neo:active {
        box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark), inset -4px -4px 8px var(--hotel-shadow-light);
        transform: translateY(0);
    }

    .btn-back {
        width: 45px;
        height: 45px;
        padding: 0;
        justify-content: center;
        border-radius: 50%;
        color: var(--hotel-gold);
    }

    .btn-save {
        background: var(--hotel-blue);
        color: white;
    }

    /* TABLA PROFESIONAL */
    .tabla-container-neo {
        background: var(--hotel-bg);
        border-radius: 25px;
        padding: 25px;
        box-shadow: 15px 15px 30px var(--hotel-shadow-dark), -15px -15px 30px var(--hotel-shadow-light);
        overflow-x: auto;
    }

    .tabla-neo {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 15px;
    }

    .tabla-neo th {
        padding: 15px;
        text-align: left;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #718096;
        letter-spacing: 2px;
    }

    .tabla-neo td {
        padding: 20px 15px;
        background: #f1f3f5;
        border: none;
        font-size: 0.9rem;
        vertical-align: middle;
    }

    .tabla-neo tr td:first-child { border-radius: 20px 0 0 20px; font-weight: 800; }
    .tabla-neo tr td:last-child { border-radius: 0 20px 20px 0; text-align: center; }

    .img-tabla {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        object-fit: cover;
        box-shadow: 3px 3px 6px var(--hotel-shadow-dark);
    }

    /* STATUS PILLS */
    .status-pill {
        padding: 6px 15px;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 900;
        text-transform: uppercase;
    }
    .status-pill.active { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-pill.inactive { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* MODAL */
    .modal-neo {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(224, 224, 228, 0.7);
        backdrop-filter: blur(15px);
        display: flex; justify-content: center; align-items: center;
        z-index: 1000;
    }

    .modal-content-neo {
        background: var(--hotel-bg);
        padding: 40px;
        border-radius: 40px;
        width: 1000px;
        max-width: 95%;
        box-shadow: 30px 30px 60px var(--hotel-shadow-dark), -30px -30px 60px var(--hotel-shadow-light);
        max-height: 95vh;
        overflow-y: auto;
    }

    .input-neo {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border: none;
        border-radius: 15px;
        background: var(--hotel-bg);
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        color: #2c3e50;
        font-weight: 600;
        outline: none;
        appearance: auto;
    }

    .form-row { display: flex; gap: 15px; margin-bottom: 5px; }
    .form-row > * { flex: 1; }

    .label-hint {
        font-size: 0.65rem;
        font-weight: 900;
        color: #718096;
        margin-left: 5px;
        margin-bottom: 5px;
        display: block;
        text-transform: uppercase;
    }

    .hidden { display: none !important; }

    /* COMPONENTES SEDES */
    .sedes-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 30px;
        margin-bottom: 20px;
    }

    .preview-box {
        width: 100%;
        height: 200px;
        border-radius: 20px;
        background: var(--hotel-bg);
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-bottom: 15px;
        position: relative;
    }

    #logoPreview {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
    }

    #mapContainer {
        height: 300px;
        width: 100%;
        border-radius: 20px;
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        z-index: 10;
        margin-bottom: 15px;
        border: 2px solid var(--hotel-shadow-light);
    }

    .section-title {
        font-size: 0.75rem;
        font-weight: 900;
        color: var(--hotel-blue);
        text-transform: uppercase;
        border-bottom: 2px solid #d1d1d6;
        padding-bottom: 5px;
        margin-bottom: 15px;
        letter-spacing: 1px;
    }
</style>

<div class="modulo-container animate__animated animate__fadeIn">
    
    <div class="header-modulo">
        <div class="header-left">
            <button class="btn-neo btn-back" onclick="App.renderView('dashboard', 'viewport')" title="REGRESAR AL DASHBOARD">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2><i class="fas fa-building"></i> Gestión de Establecimientos</h2>
        </div>
        
        <button class="btn-neo" onclick="SedesModule.abrirModal()">
            <i class="fas fa-plus-circle"></i> AGREGAR SEDE
        </button>
    </div>

    <div class="tabla-container-neo">
        <table class="tabla-neo">
            <thead>
                <tr>
                    <th style="width: 80px;">Identidad</th>
                    <th>RUC / ID Fiscal</th>
                    <th>Nombre de Sede</th>
                    <th>Ubicación (Ciudad)</th>
                    <th>Estado</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaSedesBody">
                </tbody>
        </table>
    </div>

    <div id="modalSede" class="modal-neo hidden">
        <div class="modal-content-neo animate__animated animate__zoomIn">
            <h3 id="modalSedeTitle" style="color: var(--hotel-blue); text-align:center; margin-bottom: 25px; letter-spacing: 2px; text-transform: uppercase;">Ficha de Establecimiento</h3>
            
            <form id="formSede">
                <input type="hidden" id="sedeId" name="SedeID">
                
                <div class="sedes-grid">
                    <div>
                        <div class="section-title">Identidad Visual</div>
                        <div class="preview-box">
                            <img id="logoPreview" alt="Vista previa del logo">
                            <i id="logoPlaceholder" class="fas fa-image fa-4x" style="color: #adb5bd;"></i>
                        </div>
                        
                        <label class="btn-neo" style="width:100%; justify-content:center; cursor:pointer; margin-bottom: 15px;">
                            <i class="fas fa-upload"></i> SELECCIONAR LOGO
                            <input type="file" id="inputLogo" name="Logo" hidden accept="image/*" onchange="SedesModule.handleLogoChange(this)">
                        </label>

                        <label class="label-hint">Sitio Web / Portal</label>
                        <input type="url" id="website" name="Website" class="input-neo" placeholder="https://hotel-ejemplo.com">
                        
                        <label class="label-hint">Estado del Nodo</label>
                        <select id="estadoSede" name="Estado" class="input-neo">
                            <option value="1">OPERATIVO / ACTIVO</option>
                            <option value="0">SUSPENDIDO / INACTIVO</option>
                        </select>
                    </div>

                    <div>
                        <div class="section-title">Información Fiscal (Ecuador)</div>
                        <div class="form-row">
                            <div>
                                <label class="label-hint">RUC (Registro Unificado)</label>
                                <input type="text" id="ruc_nit" name="RUC_NIT" class="input-neo" required maxlength="13">
                            </div>
                            <div>
                                <label class="label-hint">Nombre Comercial</label>
                                <input type="text" id="nombreComercial" name="NombreComercial" class="input-neo" required>
                            </div>
                        </div>
                        
                        <label class="label-hint">Razón Social del Contribuyente</label>
                        <input type="text" id="razonSocial" name="RazonSocial" class="input-neo">

                        <div class="form-row">
                            <div>
                                <label class="label-hint">Régimen Tributario SRI</label>
                                <select id="regimenTributario" name="RegimenTributario" class="input-neo">
                                    <option value="GENERAL">RÉGIMEN GENERAL</option>
                                    <option value="RIMPE_E">RIMPE - EMPRENDEDOR</option>
                                    <option value="RIMPE_NP">RIMPE - NEGOCIO POPULAR</option>
                                </select>
                            </div>
                            <div>
                                <label class="label-hint">¿Obligado a Contabilidad?</label>
                                <select id="obligadoContabilidad" name="ObligadoContabilidad" class="input-neo">
                                    <option value="0">NO LLEVA CONTABILIDAD</option>
                                    <option value="1">SÍ, ESTÁ OBLIGADO</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div>
                                <label class="label-hint">Agente de Retención</label>
                                <input type="text" id="agenteRetencion" name="AgenteRetencion" class="input-neo" placeholder="Nro Resolución">
                            </div>
                            <div>
                                <label class="label-hint">Contribuyente Especial</label>
                                <input type="text" id="contribuyenteEspecial" name="ContribuyenteEspecial" class="input-neo" placeholder="Nro Resolución">
                            </div>
                        </div>

                        <div class="form-row">
                            <div>
                                <label class="label-hint">Símbolo Monetario</label>
                                <input type="text" id="monedaSimbolo" name="MonedaSimbolo" class="input-neo" value="$ (USD)">
                            </div>
                            <div>
                                <label class="label-hint">IVA Local (%)</label>
                                <input type="number" step="0.01" id="impuestoPorcentaje" name="ImpuestoPorcentaje" class="input-neo" value="15.00">
                            </div>
                        </div>

                        <div class="section-title">Información de Contacto</div>
                        <div class="form-row">
                            <div>
                                <label class="label-hint">Teléfono / PBX</label>
                                <input type="text" id="telefono" name="Telefono" class="input-neo">
                            </div>
                            <div>
                                <label class="label-hint">Correo Corporativo</label>
                                <input type="email" id="emailContacto" name="EmailContacto" class="input-neo">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section-title">Ubicación Geográfica y Coordenadas</div>
                
                <label class="label-hint">Dirección Exacta (Enter para geolocalizar)</label>
                <input type="text" id="direccion" name="Direccion" class="input-neo" placeholder="Calle Principal y Secundaria, Referencia..." 
                       onkeypress="if(event.key==='Enter'){event.preventDefault(); SedesModule.buscarDireccion();}">
                
                <div class="form-row">
                    <div>
                        <label class="label-hint">Ciudad / Cantón</label>
                        <input type="text" id="ciudad" name="Ciudad" class="input-neo">
                    </div>
                    <div>
                        <label class="label-hint">Provincia</label>
                        <input type="text" id="provincia_estado" name="Provincia_Estado" class="input-neo" onblur="SedesModule.sugerirRegionDecimoCuarto()">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label class="label-hint">Región para Décimo Cuarto Sueldo (Art. 113 Código de Trabajo)</label>
                        <select id="region_decimo_cuarto" name="RegionDecimoCuarto" class="input-neo">
                            <option value="">-- Seleccionar --</option>
                            <option value="SIERRA">Sierra / Amazonía (período ago-jul, pago tope 15-ago)</option>
                            <option value="COSTA">Costa / Galápagos (período mar-feb, pago tope 15-mar)</option>
                        </select>
                    </div>
                </div>

                <div id="mapContainer"></div>
                
                <div class="form-row">
                    <div>
                        <label class="label-hint">Latitud</label>
                        <input type="text" id="latitud" name="Latitud" class="input-neo" readonly>
                    </div>
                    <div>
                        <label class="label-hint">Longitud</label>
                        <input type="text" id="longitud" name="Longitud" class="input-neo" readonly>
                    </div>
                </div>

                <div style="display:flex; gap:20px; margin-top:25px;">
                    <button type="button" class="btn-neo" style="flex:1; justify-content:center; color: var(--hotel-danger);" onclick="SedesModule.cerrarModal()">
                        <i class="fas fa-times"></i> DESCARTAR CAMBIOS
                    </button>
                    <button type="submit" class="btn-neo btn-save" style="flex:1; justify-content:center;">
                        <i class="fas fa-save"></i> GUARDAR CONFIGURACIÓN
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
