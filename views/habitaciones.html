<style>
    :root {
        --hotel-blue: #1a365d;
        --hotel-gold: #c5a059;
        --hotel-bg: #e0e0e4;
        --hotel-shadow-dark: #bebebe;
        --hotel-shadow-light: #ffffff;
        --hotel-danger: #e74c3c;
        --hotel-success: #2ecc71;
        --hotel-warning: #f1c40f;
        --hotel-info: #3498db;
    }

    .modulo-container { 
        padding: 40px; 
        color: #2c3e50; 
        animation: fadeIn 0.4s ease-out; 
    }

    /* HEADER ESTRUCTURAL */
    .header-modulo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 35px;
        gap: 20px;
    }

    .header-left { 
        display: flex; 
        align-items: center; 
        gap: 20px; 
    }

    .header-modulo h2 {
        font-size: 1.6rem;
        color: var(--hotel-blue);
        letter-spacing: 1px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
    }

    /* SELECTOR DINÁMICO */
    #sedeSelectorContainer {
        display: flex;
        align-items: center;
        min-width: 200px;
    }

    /* BOTONES NEUMÓRFICOS */
    .btn-back {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        color: var(--hotel-gold);
        background: var(--hotel-bg);
        box-shadow: 6px 6px 12px var(--hotel-shadow-dark), -6px -6px 12px var(--hotel-shadow-light);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .btn-back:hover { 
        transform: translateY(-2px); 
        box-shadow: 2px 2px 5px var(--hotel-shadow-dark), -2px -2px 5px var(--hotel-shadow-light); 
    }

    .btn-neo {
        padding: 12px 25px;
        border-radius: 15px;
        background: var(--hotel-bg);
        box-shadow: 6px 6px 12px var(--hotel-shadow-dark), -6px -6px 12px var(--hotel-shadow-light);
        border: none;
        cursor: pointer;
        font-weight: 800;
        color: var(--hotel-blue);
        display: flex;
        align-items: center;
        gap: 10px;
        text-transform: uppercase;
        font-size: 0.75rem;
    }

    .btn-save { 
        background: var(--hotel-blue);
        color: white; 
    }

    /* TABS */
    .tabs-wrapper {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
        padding: 10px;
    }

    .tab-btn {
        padding: 12px 25px;
        border-radius: 12px;
        border: none;
        background: var(--hotel-bg);
        box-shadow: 4px 4px 8px var(--hotel-shadow-dark), -4px -4px 8px var(--hotel-shadow-light);
        color: var(--hotel-blue);
        font-weight: 900;
        cursor: pointer;
        font-size: 0.7rem;
        transition: 0.3s;
    }

    .tab-btn.active {
        box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark), inset -4px -4px 8px var(--hotel-shadow-light);
        color: var(--hotel-gold);
    }

    /* GRID Y CARDS */
    .habitaciones-grid {
        display: block; /* Ya no es grid aquí, el grid va dentro de cada piso */
        width: 100%;
    }

    .room-card {
        background: var(--hotel-bg);
        border-radius: 30px;
        padding: 30px 20px;
        text-align: center;
        box-shadow: 12px 12px 24px var(--hotel-shadow-dark), -12px -12px 24px var(--hotel-shadow-light);
        cursor: pointer;
        transition: 0.3s;
        border: 1px solid rgba(255,255,255,0.4);
        position: relative;
    }

    .room-card:hover { transform: translateY(-5px); }
    .room-card h3 { font-size: 2.5rem; margin: 10px 0; font-weight: 900; color: var(--hotel-blue); }
    .room-card p { font-size: 0.65rem; font-weight: 900; color: var(--hotel-gold); text-transform: uppercase; margin: 0; }

    .status-badge {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 14px; height: 14px;
        border-radius: 50%;
        border: 2px solid var(--hotel-bg);
    }

    /* MODAL */
    .modal-neo {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(224, 224, 228, 0.8);
        backdrop-filter: blur(10px);
        display: flex; justify-content: center; align-items: center;
        z-index: 1000;
    }

    .modal-content-neo {
        background: var(--hotel-bg);
        width: 550px;
        padding: 40px;
        border-radius: 40px;
        box-shadow: 20px 20px 60px var(--hotel-shadow-dark), -20px -20px 60px var(--hotel-shadow-light);
        max-height: 90vh;
        overflow-y: auto;
    }

    .input-neo {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 15px;
        background: var(--hotel-bg);
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        margin-bottom: 15px;
        font-weight: 600;
        color: var(--hotel-blue);
        outline: none;
        box-sizing: border-box;
    }

    .label-hint { 
        font-size: 0.6rem; 
        font-weight: 900; 
        color: #718096; 
        margin: 0 0 5px 10px; 
        display: block; 
        text-transform: uppercase; 
    }

    .hidden { display: none !important; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="modulo-container animate__animated animate__fadeIn">
    
    <div class="header-modulo">
        <div class="header-left">
            <button class="btn-back" onclick="App.renderView('dashboard', 'viewport')" title="REGRESAR">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <h2>Habitaciones e Inventario</h2>
                <p style="font-size: 0.8rem; color: #7f8c8d; font-weight: 600; margin:0;">Gestión de activos y disponibilidad operativa</p>
            </div>
            <div id="sedeSelectorContainer"></div>
        </div>
        
        <div style="display:flex; gap:15px;">
            <button class="btn-neo hidden" id="btnVerDesactivadas" onclick="HabitacionesModule.verDesactivadas()">
                <i class="fas fa-eye-slash"></i> DESACTIVADAS
            </button>
            <button class="btn-neo" onclick="HabitacionesModule.abrirModalTipo()">
                <i class="fas fa-tags"></i> NUEVA CATEGORÍA
            </button>
            <button class="btn-neo btn-save" onclick="HabitacionesModule.abrirModalHab()">
                <i class="fas fa-plus-circle"></i> NUEVA UNIDAD
            </button>
        </div>
    </div>

    <div class="tabs-wrapper">
        <button class="tab-btn active" id="btnTabHab" onclick="HabitacionesModule.switchTab('hab')">VISTA DE PLANTA</button>
        <button class="tab-btn" id="btnTabTipos" onclick="HabitacionesModule.switchTab('tipos')">TARIFARIO Y CATEGORÍAS</button>
    </div>

    <div id="tabHabitaciones">
        <div class="habitaciones-grid" id="gridHabitaciones">
            </div>
    </div>

    <div id="tabTipos" class="hidden">
        <div class="tabla-container-neo" style="background: var(--hotel-bg); border-radius: 25px; padding: 25px; box-shadow: 10px 10px 20px var(--hotel-shadow-dark);">
            <table class="tabla-neo" style="width:100%; border-collapse: separate; border-spacing: 0 12px;">
                <thead>
                    <tr style="text-align: left; font-size: 0.7rem; color: #718096; text-transform: uppercase; letter-spacing: 1px;">
                        <th style="padding:15px;">Descripción de Categoría</th>
                        <th>Capacidad Permitida</th>
                        <th>Tarifa Base</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTiposBody"></tbody>
            </table>
        </div>
    </div>

    <div id="modalHabitacion" class="modal-neo hidden">
        <div class="modal-content-neo animate__animated animate__zoomIn">
            <h3 style="text-align:center; color: var(--hotel-blue); text-transform: uppercase; font-weight: 900; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-gold); padding-bottom: 10px;">Ficha de Habitación</h3>
            
            <form id="formHabitacion">
                <input type="hidden" id="habitacionId">
                
                <div style="display:flex; gap:15px;">
                    <div style="flex:2">
                        <label class="label-hint">Identificador / Nro.</label>
                        <input type="text" id="nroHabitacion" class="input-neo" required placeholder="Ej: 204">
                    </div>
                    <div style="flex:1">
                        <label class="label-hint">Nivel / Piso</label>
                        <input type="number" id="pisoHab" class="input-neo" required placeholder="1">
                    </div>
                </div>

                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <label class="label-hint">Categoría de Servicio</label>
                        <select id="tipoIdSelect" class="input-neo" required></select>
                    </div>
                    <div style="flex:1">
                        <label class="label-hint">Estado Operativo</label>
                        <select id="estadoHab" class="input-neo" required>
                            <option value="DISPONIBLE">DISPONIBLE</option>
                            <option value="OCUPADA">OCUPADA</option>
                            <option value="LIMPIEZA">LIMPIEZA</option>
                            <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                        </select>
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label class="label-hint">Tarifa Día</label>
                        <input type="number" step="0.01" id="precioDia" class="input-neo" required>
                    </div>
                    <div style="flex:1">
                        <label class="label-hint">Tarifa Periodo</label>
                        <input type="number" step="0.01" id="precioPeriodo" class="input-neo" placeholder="0.00">
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label class="label-hint">Tarifa Momento</label>
                        <input type="number" step="0.01" id="precioMomento" class="input-neo" placeholder="0.00">
                    </div>
                    <div style="flex:1">
                        <label class="label-hint">Horas (Momento)</label>
                        <input type="number" id="horasMomentoHab" class="input-neo" value="3" required>
                    </div>
                </div>

                <label class="label-hint">Observaciones Técnicas</label>
                <textarea id="observacionesHab" class="input-neo" rows="3" style="resize:none;" placeholder="Equipamiento, daños o notas..."></textarea>

                <div style="display:flex; gap:20px; margin-top:20px;">
                    <button type="button" class="btn-neo" style="flex:1; justify-content:center;" onclick="HabitacionesModule.cerrarModales()">
                        CANCELAR
                    </button>
                    <button type="submit" class="btn-neo btn-save" style="flex:1; justify-content:center;">
                        GUARDAR REGISTRO
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalTipoHabitacion" class="modal-neo hidden">
        <div class="modal-content-neo animate__animated animate__zoomIn">
            <h3 style="text-align:center; color: var(--hotel-blue); text-transform: uppercase; font-weight: 900; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-gold); padding-bottom: 10px;">Definición de Categoría</h3>
            
            <form id="formTipoHabitacion">
                <input type="hidden" id="tipoId">
                
                <label class="label-hint">Descripción / Nombre</label>
                <input type="text" id="descTipo" class="input-neo" required placeholder="Ej: Suite Matrimonial Deluxe">

                <div style="display:flex; gap:15px;">
                    <div style="flex:1">
                        <label class="label-hint">Capacidad Adultos</label>
                        <input type="number" id="capAdultos" class="input-neo" required value="2">
                    </div>
                    <div style="flex:1">
                        <label class="label-hint">Capacidad Niños</label>
                        <input type="number" id="capNinos" class="input-neo" required value="0">
                    </div>
                </div>

                <label class="label-hint">Precio Base de Referencia</label>
                <input type="number" step="0.01" id="precioBaseTipo" class="input-neo" required placeholder="0.00">

                <div style="display:flex; gap:20px; margin-top:20px;">
                    <button type="button" class="btn-neo" style="flex:1; justify-content:center;" onclick="HabitacionesModule.cerrarModales()">
                        CANCELAR
                    </button>
                    <button type="submit" class="btn-neo btn-save" style="flex:1; justify-content:center;">
                        CONFIRMAR CATEGORÍA
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
