<style>
    :root {
        --hotel-blue: #1a365d;
        --hotel-gold: #c5a059;
        --hotel-bg: #e0e0e4;
        --hotel-shadow-dark: #bebebe;
        --hotel-shadow-light: #ffffff;
        --hotel-danger: #e74c3c;
        --hotel-success: #27ae60;
        --hotel-warning: #f39c12;
    }

    .modulo-container { padding: 40px; color: #2c3e50; }
    
    .header-modulo { 
        display: flex; justify-content: space-between; align-items: center; 
        margin-bottom: 30px; gap: 20px; 
    }
    
    .header-left { display: flex; align-items: center; gap: 20px; }
    
    .header-modulo h2 { 
        font-size: 1.5rem; color: var(--hotel-blue); letter-spacing: 2px; 
        font-weight: 900; text-transform: uppercase; margin: 0; 
    }
    
    .btn-neo {
        padding: 12px 25px; border: none; border-radius: 15px; background: var(--hotel-bg);
        box-shadow: 6px 6px 12px var(--hotel-shadow-dark), -6px -6px 12px var(--hotel-shadow-light);
        cursor: pointer; transition: all 0.3s ease; font-weight: 800; color: var(--hotel-blue);
        display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.85rem;
    }
    .btn-neo i { font-size: 1.1rem; }
    .btn-neo:hover { box-shadow: 2px 2px 5px var(--hotel-shadow-dark), -2px -2px 5px var(--hotel-shadow-light); transform: translateY(-1px); }
    .btn-neo:active { box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark), inset -4px -4px 8px var(--hotel-shadow-light); transform: translateY(0); }
    
    .btn-back { width: 45px; height: 45px; padding: 0; border-radius: 50%; color: var(--hotel-gold); }
    .btn-save { background: var(--hotel-blue); color: white; }

    .input-neo {
        width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 15px; background: var(--hotel-bg);
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        color: #2c3e50; font-weight: 600; outline: none; box-sizing: border-box;
    }

    .label-hint { font-size: 0.65rem; font-weight: 900; color: #718096; margin-left: 5px; margin-bottom: 5px; display: block; text-transform: uppercase; }
    .hidden { display: none !important; }

    .modal-neo {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(224, 224, 228, 0.7); backdrop-filter: blur(15px);
        display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content-neo {
        background: var(--hotel-bg); padding: 40px; border-radius: 40px; width: 500px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 30px 30px 60px var(--hotel-shadow-dark), -30px -30px 60px var(--hotel-shadow-light);
        max-height: 95vh; overflow-y: auto; transition: width 0.3s ease;
    }

    /* ESTILOS GRID DE PARQUEADERO */
    .grid-espacios {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 25px;
        padding: 10px;
    }

    .espacio-card {
        background: var(--hotel-bg);
        border-radius: 25px;
        padding: 20px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 10px 10px 20px var(--hotel-shadow-dark), -10px -10px 20px var(--hotel-shadow-light);
        position: relative;
        border: 3px solid transparent;
    }

    .espacio-card:hover { transform: translateY(-5px); }
    .espacio-card:active { box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark); }
    
    .espacio-card.libre { border-color: var(--hotel-success); }
    .espacio-card.ocupada { border-color: var(--hotel-danger); background: #fdf2f2; }
    .espacio-card.mantenimiento { border-color: var(--hotel-warning); opacity: 0.7; }
    
    .nro-espacio { font-size: 2rem; font-weight: 900; color: var(--hotel-blue); margin: 10px 0; }
    .espacio-status { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .placa-badge { background: var(--hotel-danger); color: white; padding: 4px 10px; border-radius: 10px; font-weight: 900; margin-top: 5px; font-family: monospace; letter-spacing: 1px; }
    
    .btn-config {
        position: absolute; top: 12px; right: 12px; background: none; border: none; color: #718096; cursor: pointer; transition: color 0.2s;
    }
    .btn-config:hover { color: var(--hotel-blue); }
</style>

<div class="modulo-container animate__animated animate__fadeIn">
    <div class="header-modulo">
        <div class="header-left">
            <button class="btn-neo btn-back" onclick="App.renderView('dashboard', 'viewport')" title="REGRESAR">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <h2>Parqueadero <span style="font-weight: 300;">| Control Vehicular</span></h2>
                <div id="sedeSelectorParqueadero" style="margin-top: 10px;"></div>
            </div>
        </div>
        <div style="display: flex; gap: 15px;">
            <button class="btn-neo" onclick="ParqueaderoModule.abrirModalConfig()">
                <i class="fas fa-plus-circle"></i> CREAR ESPACIO
            </button>
            <button class="btn-neo" onclick="ParqueaderoModule.cargarEspacios()">
                <i class="fas fa-sync-alt"></i> ACTUALIZAR MAPA
            </button>
        </div>
    </div>

    <div style="height: calc(100vh - 200px); overflow-y: auto;">
        <div id="grid-espacios" class="grid-espacios">
            </div>
    </div>
</div>

<div id="modalConfigEspacio" class="modal-neo hidden">
    <div class="modal-content-neo animate__animated animate__zoomIn">
        <h3 style="color: var(--hotel-blue); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-gold); padding-bottom: 15px;">CONFIGURACIÓN DE ESPACIO</h3>
        
        <form id="formConfigEspacio">
            <input type="hidden" id="cfg-id">
            
            <label class="label-hint">Código del Espacio (Ej: A-01, VIP-1)</label>
            <input type="text" id="cfg-codigo" class="input-neo" required>

            <label class="label-hint">Zona o Nivel (Ej: Sótano 1, Parqueadero Externo)</label>
            <input type="text" id="cfg-zona" class="input-neo" value="PRINCIPAL" required>
            
            <label class="label-hint">Tipo de Vehículo Soportado</label>
            <select id="cfg-tipo" class="input-neo">
                <option value="AUTO">Automóvil</option>
                <option value="MOTO">Motocicleta</option>
                <option value="BUS">Bus / Pesado</option>
                <option value="DISCAPACITADO">Uso Exclusivo Discapacitados</option>
            </select>

            <label class="label-hint">Estado Físico</label>
            <select id="cfg-estado" class="input-neo">
                <option value="LIBRE">Operativo / Libre</option>
                <option value="MANTENIMIENTO">En Mantenimiento</option>
            </select>
            
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button type="button" class="btn-neo" style="flex: 1;" onclick="ParqueaderoModule.cerrarModales()">CANCELAR</button>
                <button type="submit" class="btn-neo btn-save" style="flex: 1;"><i class="fas fa-save"></i> GUARDAR</button>
            </div>
            
            <button type="button" id="btn-eliminar-espacio" class="btn-neo" style="width: 100%; margin-top: 15px; background: var(--hotel-danger); color: white; display: none;" onclick="ParqueaderoModule.eliminarEspacio()">
                <i class="fas fa-trash"></i> ELIMINAR ESPACIO FÍSICO
            </button>
        </form>
    </div>
</div>

<div id="modalIngreso" class="modal-neo hidden">
    <div class="modal-content-neo animate__animated animate__zoomIn">
        <h3 style="color: var(--hotel-success); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-success); padding-bottom: 15px;">
            <i class="fas fa-arrow-right"></i> REGISTRAR INGRESO
        </h3>
        
        <form id="formIngreso">
            <input type="hidden" id="ing-espacio-id">
            
            <h2 id="ing-ui-codigo" style="text-align:center; color:var(--hotel-blue); margin-bottom:20px; font-size:2.5rem;">A-01</h2>

            <label class="label-hint">Número de Placa</label>
            <input type="text" id="ing-placa" class="input-neo" style="font-family: monospace; font-size: 1.5rem; text-transform: uppercase; text-align: center;" required autocomplete="off">
            
            <label class="label-hint">Vincular a Huésped (Dejar en Blanco si es Cliente de Lobby)</label>
            <select id="ing-recepcion" class="input-neo">
                <option value="">-- CLIENTE EXTERNO (LOBBY) --</option>
                </select>

            <label class="label-hint">Observaciones del Vehículo</label>
            <input type="text" id="ing-obs" class="input-neo" placeholder="Ej: Rayón puerta derecha...">
            
            <div style="display: flex; gap: 15px; margin-top: 25px;">
                <button type="button" class="btn-neo" style="flex: 1;" onclick="ParqueaderoModule.cerrarModales()">CANCELAR</button>
                <button type="submit" class="btn-neo" style="flex: 1; background: var(--hotel-success); color: white;"><i class="fas fa-check"></i> CONFIRMAR INGRESO</button>
            </div>
        </form>
    </div>
</div>

<div id="modalSalida" class="modal-neo hidden">
    <div class="modal-content-neo animate__animated animate__zoomIn">
        <h3 style="color: var(--hotel-danger); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-danger); padding-bottom: 15px;">
            <i class="fas fa-sign-out-alt"></i> SALIDA Y COBRO
        </h3>
        
        <form id="formSalida">
            <input type="hidden" id="out-ticket-id">
            
            <div style="text-align:center; margin-bottom:20px;">
                <div style="font-size: 0.8rem; font-weight:bold; color:#718096;">PLACA DEL VEHÍCULO</div>
                <div id="out-ui-placa" style="font-size: 2.5rem; font-family: monospace; font-weight:900; color:var(--hotel-blue);">ABC-123</div>
                <div id="out-ui-huesped" style="font-size: 0.9rem; font-weight:bold; color:var(--hotel-gold); margin-top:5px;"></div>
            </div>

            <div style="display:flex; justify-content:space-between; background:#f1f3f5; padding:15px; border-radius:15px; margin-bottom:20px;">
                <div>
                    <span class="label-hint">HORA INGRESO</span>
                    <strong id="out-ui-ingreso" style="color:var(--hotel-blue);">--:--</strong>
                </div>
                <div style="text-align:right;">
                    <span class="label-hint">TIEMPO TRANSCURRIDO</span>
                    <strong id="out-ui-tiempo" style="color:var(--hotel-danger);">-- hrs -- min</strong>
                </div>
            </div>

            <div id="panel-cobro-externo">
                <label class="label-hint">Servicio a Facturar (Inventario)</label>
                <select id="out-producto" class="input-neo" required>
                    </select>

                <div class="form-row">
                    <div style="flex:1;">
                        <label class="label-hint">Total a Cobrar ($)</label>
                        <input type="number" step="0.01" id="out-total" class="input-neo" value="0.00" required>
                    </div>
                    <div style="flex:1;" id="box-metodo-pago">
                        <label class="label-hint">Método Pago (Caja)</label>
                        <select id="out-metodo" class="input-neo">
                            <option value="1">EFECTIVO</option>
                            <option value="2">TRANSFERENCIA</option>
                            <option value="3">TARJETA</option>
                        </select>
                    </div>
                </div>

                <div class="form-row" style="margin-top:10px;">
                    <div style="flex:1;">
                        <label class="label-hint">Referencia (Opcional)</label>
                        <input type="text" id="out-referencia" class="input-neo" placeholder="Lote / Nro. Comprobante">
                    </div>
                </div>

                <div id="box-voucher-salida" style="display:none; margin-top:10px;">
                    <label class="label-hint">Foto del Comprobante</label>
                    <input type="file" id="out-voucher" class="input-neo" accept="image/*,application/pdf">
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 15px;">
                <button type="button" class="btn-neo" style="flex: 1;" onclick="ParqueaderoModule.cerrarModales()">CANCELAR</button>
                <button type="submit" class="btn-neo" id="btn-procesar-salida" style="flex: 1; background: var(--hotel-blue); color: white;"><i class="fas fa-flag-checkered"></i> PROCESAR SALIDA</button>
            </div>
        </form>
    </div>
</div>
