<style>
    :root {
        --hotel-blue: #1a365d;
        --hotel-gold: #c5a059;
        --hotel-bg: #e0e0e4;
        --hotel-shadow-dark: #bebebe;
        --hotel-shadow-light: #ffffff;
        --hotel-danger: #e74c3c;
    }

    .modulo-container {
        padding: 40px;
        color: #2c3e50;
    }

    /* HEADER */
    .header-modulo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        gap: 20px;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .header-modulo h2 {
        font-size: 1.5rem;
        color: var(--hotel-blue);
        letter-spacing: 2px;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
    }

    /* BOTONES NEOMÓRFICOS */
    .btn-neo {
        padding: 12px 25px;
        border: none;
        border-radius: 15px;
        background: var(--hotel-bg);
        box-shadow: 6px 6px 12px var(--hotel-shadow-dark), -6px -6px 12px var(--hotel-shadow-light);
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: 800;
        color: var(--hotel-blue);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
    }

    .btn-neo i { font-size: 1.1rem; }

    .btn-neo:hover {
        box-shadow: 2px 2px 5px var(--hotel-shadow-dark), -2px -2px 5px var(--hotel-shadow-light);
        transform: translateY(-1px);
    }

    .btn-neo:active {
        box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark), inset -4px -4px 8px var(--hotel-shadow-light);
        transform: translateY(0);
    }

    .btn-back {
        width: 45px;
        height: 45px;
        padding: 0;
        justify-content: center;
        border-radius: 50%;
        color: var(--hotel-gold);
    }

    .btn-save {
        background: var(--hotel-blue);
        color: white;
    }

    /* TABLA PROFESIONAL */
    .tabla-container-neo {
        background: var(--hotel-bg);
        border-radius: 25px;
        padding: 25px;
        box-shadow: 15px 15px 30px var(--hotel-shadow-dark), -15px -15px 30px var(--hotel-shadow-light);
    }

    .tabla-neo {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 15px;
    }

    .tabla-neo th {
        padding: 15px;
        text-align: left;
        text-transform: uppercase;
        font-size: 0.7rem;
        color: #718096;
        letter-spacing: 2px;
    }

    .tabla-neo td {
        padding: 20px 15px;
        background: #f1f3f5;
        border: none;
        font-size: 0.9rem;
    }

    .tabla-neo tr td:first-child { border-radius: 20px 0 0 20px; font-weight: 800; }
    .tabla-neo tr td:last-child { border-radius: 0 20px 20px 0; text-align: center; }

    /* STATUS PILLS */
    .status-pill {
        padding: 6px 15px;
        border-radius: 12px;
        font-size: 0.7rem;
        font-weight: 900;
        text-transform: uppercase;
    }
    .status-pill.active { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-pill.inactive { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* MODAL CON MEJORAS DE ELEGANCIA */
    .modal-neo {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(224, 224, 228, 0.7);
        backdrop-filter: blur(15px);
        display: flex; justify-content: center; align-items: center;
        z-index: 1000;
    }

    .modal-content-neo {
        background: var(--hotel-bg);
        padding: 40px;
        border-radius: 40px;
        width: 550px;
        /* Borde de cristal sutil para separar del fondo */
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 
            30px 30px 60px var(--hotel-shadow-dark), 
            -30px -30px 60px var(--hotel-shadow-light),
            inset 2px 2px 5px rgba(255,255,255,0.5),
            inset -2px -2px 5px rgba(0,0,0,0.05);
        max-height: 90vh;
        overflow-y: auto;
    }

    #modalTitulo {
        color: var(--hotel-blue);
        text-align: center;
        margin-bottom: 25px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-bottom: 2px solid var(--hotel-gold);
        padding-bottom: 15px;
        display: block;
    }

    /* INPUTS INSET */
    .input-neo {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border: none;
        border-radius: 15px;
        background: var(--hotel-bg);
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        color: #2c3e50;
        font-weight: 600;
        outline: none;
        box-sizing: border-box;
    }

    .form-row {
        display: flex;
        gap: 15px;
        margin-bottom: 5px;
    }

    .modal-actions {
        display: flex;
        gap: 20px;
        margin-top: 15px;
    }

    .hidden { display: none !important; }

    .label-hint {
        font-size: 0.65rem;
        font-weight: 900;
        color: #718096;
        margin-left: 5px;
        margin-bottom: 5px;
        display: block;
        text-transform: uppercase;
    }

    /* Scrollbar elegante para el modal */
    .modal-content-neo::-webkit-scrollbar { width: 6px; }
    .modal-content-neo::-webkit-scrollbar-thumb { 
        background: var(--hotel-shadow-dark); 
        border-radius: 10px; 
    }
</style>

<div class="modulo-container animate__animated animate__fadeIn">
    
    <div class="header-modulo">
        <div class="header-left">
            <button class="btn-neo btn-back" onclick="App.renderView('dashboard', 'viewport')" title="REGRESAR AL DASHBOARD">
                <i class="fas fa-arrow-left"></i>
            </button>
            <h2><i class="fas fa-users-cog"></i> Administración de Personal</h2>
        </div>
        
        <button class="btn-neo" onclick="UsuariosModule.abrirModal()">
            <i class="fas fa-plus-circle"></i> NUEVO COLABORADOR
        </button>
    </div>

    <div class="tabla-container-neo">
        <table class="tabla-neo">
            <thead>
                <tr>
                    <th>Colaborador</th>
                    <th>Usuario</th>
                    <th>Rango / Rol</th>
                    <th>Sede Asignada</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaUsuariosBody"></tbody>
        </table>
    </div>

    <div id="modalUsuario" class="modal-neo hidden">
        <div class="modal-content-neo animate__animated animate__zoomIn">
            <h3 id="modalTitulo">Ficha de Registro</h3>
            
            <form id="formUsuario">
                <label class="label-hint">Información Legal</label>
                <input type="text" id="nombre" placeholder="NOMBRE COMPLETO" required class="input-neo">
                
                <div class="form-row">
                    <input type="text" id="cedula" placeholder="CEDULA / RUC" required class="input-neo">
                    <input type="text" id="telefono" placeholder="TELEFONO / CELULAR" class="input-neo">
                </div>

                <input type="email" id="correo" placeholder="CORREO ELECTRONICO" class="input-neo">
                <input type="text" id="direccion" placeholder="DIRECCION DOMICILIARIA" class="input-neo">

                <label class="label-hint">Credenciales de Acceso</label>
                <div class="form-row">
                    <input type="text" id="usuario" placeholder="USUARIO (LOGIN)" required class="input-neo">
                    <input type="password" id="password" placeholder="CONTRASEÑA" class="input-neo">
                </div>
                
                <label class="label-hint">Rol del Sistema</label>
                <select id="rolId" class="input-neo" required></select>

                <label class="label-hint">Sede Operativa</label>
                <select id="sedeId" class="input-neo" required></select>

                <div class="modal-actions">
                    <button type="button" class="btn-neo" style="flex:1" onclick="UsuariosModule.cerrarModal()">
                        CANCELAR
                    </button>
                    <button type="submit" class="btn-neo btn-save" style="flex:1">
                        GUARDAR REGISTRO
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
