<style>
    :root {
        --hotel-blue: #1a365d;
        --hotel-gold: #c5a059;
        --hotel-bg: #e0e0e4;
        --hotel-shadow-dark: #bebebe;
        --hotel-shadow-light: #ffffff;
        --hotel-danger: #e74c3c;
        --hotel-success: #27ae60;
    }

    /* =========================================
       CSS BASE NEOMÓRFICO COHERENTE
       ========================================= */
    .modulo-container { padding: 40px; color: #2c3e50; }
    
    .header-modulo { 
        display: flex; justify-content: space-between; align-items: center; 
        margin-bottom: 30px; gap: 20px; 
    }
    
    .header-left { display: flex; align-items: center; gap: 20px; }
    
    .header-modulo h2 { 
        font-size: 1.5rem; color: var(--hotel-blue); letter-spacing: 2px; 
        font-weight: 900; text-transform: uppercase; margin: 0; 
    }
    
    .btn-neo {
        padding: 12px 25px; border: none; border-radius: 15px; background: var(--hotel-bg);
        box-shadow: 6px 6px 12px var(--hotel-shadow-dark), -6px -6px 12px var(--hotel-shadow-light);
        cursor: pointer; transition: all 0.3s ease; font-weight: 800; color: var(--hotel-blue);
        display: flex; align-items: center; gap: 10px; font-size: 0.85rem;
    }
    .btn-neo i { font-size: 1.1rem; }
    .btn-neo:hover { box-shadow: 2px 2px 5px var(--hotel-shadow-dark), -2px -2px 5px var(--hotel-shadow-light); transform: translateY(-1px); }
    .btn-neo:active { box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark), inset -4px -4px 8px var(--hotel-shadow-light); transform: translateY(0); }

    /* Estilos para Filtros de Categorías */
    .btn-neo-filter {
        padding: 8px 18px; border: none; border-radius: 20px; background: var(--hotel-bg);
        box-shadow: 4px 4px 8px var(--hotel-shadow-dark), -4px -4px 8px var(--hotel-shadow-light);
        cursor: pointer; transition: all 0.2s ease; font-weight: 800; color: #718096;
        font-size: 0.75rem; white-space: nowrap; outline: none;
    }
    .btn-neo-filter:hover { transform: translateY(-1px); }
    .btn-neo-filter.active {
        box-shadow: inset 3px 3px 6px var(--hotel-shadow-dark), inset -3px -3px 6px var(--hotel-shadow-light);
        color: var(--hotel-blue);
    }
    
    .btn-back { 
        width: 45px; height: 45px; padding: 0; justify-content: center; 
        border-radius: 50%; color: var(--hotel-gold); 
    }
    
    .btn-save { background: var(--hotel-blue); color: white; }

    .input-neo {
        width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 15px; background: var(--hotel-bg);
        box-shadow: inset 5px 5px 10px var(--hotel-shadow-dark), inset -5px -5px 10px var(--hotel-shadow-light);
        color: #2c3e50; font-weight: 600; outline: none; box-sizing: border-box;
    }

    .form-row { display: flex; gap: 15px; margin-bottom: 5px; }
    .label-hint { font-size: 0.65rem; font-weight: 900; color: #718096; margin-left: 5px; margin-bottom: 5px; display: block; text-transform: uppercase; }

    .hidden { display: none !important; }

    /* MODALES NEOMÓRFICOS */
    .modal-neo {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(224, 224, 228, 0.7); backdrop-filter: blur(15px);
        display: flex; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content-neo {
        background: var(--hotel-bg); padding: 40px; border-radius: 40px; width: 550px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 30px 30px 60px var(--hotel-shadow-dark), -30px -30px 60px var(--hotel-shadow-light);
        max-height: 95vh; overflow-y: auto; transition: width 0.3s ease;
    }
    .modal-wide { width: 1000px !important; max-width: 95vw; }
    .modal-actions { display: flex; gap: 20px; margin-top: 15px; }

    /* RACK DE MESAS */
    .grid-mesas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 25px;
        padding: 20px;
    }

    .mesa-card {
        aspect-ratio: 1 / 1;
        background: var(--hotel-bg);
        border-radius: 35px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 10px 10px 20px var(--hotel-shadow-dark), -10px -10px 20px var(--hotel-shadow-light);
        position: relative;
        border: 4px solid transparent;
    }

    .mesa-card:hover { transform: translateY(-5px); }
    .mesa-card:active { box-shadow: inset 4px 4px 8px var(--hotel-shadow-dark); }
    
    .mesa-card.libre { border-color: var(--hotel-success); }
    .mesa-card.ocupada { border-color: var(--hotel-danger); background: #fdf2f2; }
    
    .nro-mesa { font-size: 2.8rem; font-weight: 900; color: var(--hotel-blue); line-height: 1; }
    .mesa-status { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }

    .restaurante-layout { display: grid; grid-template-columns: 1fr 420px; gap: 30px; height: calc(100vh - 200px); }
    
    .comanda-panel { 
        background: var(--hotel-bg); 
        border-radius: 35px; 
        padding: 30px; 
        display: flex; 
        flex-direction: column;
        box-shadow: 15px 15px 30px var(--hotel-shadow-dark), -15px -15px 30px var(--hotel-shadow-light);
    }

    .item-pedido {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        margin-bottom: 10px;
        background: var(--hotel-bg);
        border-radius: 15px;
        box-shadow: inset 3px 3px 6px var(--hotel-shadow-dark), inset -3px -3px 6px var(--hotel-shadow-light);
    }
</style>

<div class="modulo-container animate__animated animate__fadeIn">
    <div class="header-modulo">
        <div class="header-left">
            <button class="btn-neo btn-back" onclick="App.renderView('dashboard', 'viewport')" title="REGRESAR">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div>
                <h2>Restaurante <span style="font-weight: 300;">| Gestión de Servicio</span></h2>
                <div id="sedeSelectorRestaurante" style="margin-top: 10px;"></div>
            </div>
        </div>
        <div style="display: flex; gap: 15px; align-items:center;">
            <span id="mb-formato-print-host"></span>
            <button class="btn-neo" onclick="RestauranteModule.abrirPropinasDia()" style="background:#16a085; color:#fff;">
                <i class="fas fa-hand-holding-usd"></i> PROPINAS DÍA
            </button>
            <button class="btn-neo" onclick="RestauranteModule.abrirPanelCocina()" id="btn-panel-cocina" style="position:relative;">
                <i class="fas fa-fire"></i> COCINA
                <span id="badge-cocina-desktop" style="display:none; position:absolute; top:-8px; right:-8px; background:#e74c3c; color:white; border-radius:50%; width:20px; height:20px; font-size:0.7rem; font-weight:900; align-items:center; justify-content:center;">0</span>
            </button>
            <button class="btn-neo" onclick="RestauranteModule.abrirModalMesa()">
                <i class="fas fa-plus-circle"></i> AGREGAR MESA
            </button>
            <button class="btn-neo" onclick="RestauranteModule.cargarMesas()">
                <i class="fas fa-sync-alt"></i> REFRESCAR MAPA
            </button>
        </div>
    </div>

    <div class="restaurante-layout">
        <div id="view-mesas" style="overflow-y: auto; padding-right: 10px;">
            <div id="grid-mesas" class="grid-mesas"></div>
        </div>

        <div class="comanda-panel" id="panel-comanda">
            <h4 style="color: var(--hotel-blue); border-bottom: 2px solid var(--hotel-gold); padding-bottom: 15px; margin-bottom: 20px; font-weight: 900; text-transform: uppercase;">
                <i class="fas fa-utensils"></i> <span id="ui-comanda-nro">SELECCIONE MESA</span>
            </h4>
            
            <div id="comanda-vacia" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.4;">
                <i class="fas fa-hand-pointer" style="font-size: 4rem; margin-bottom: 20px;"></i>
                <p style="font-weight: 800; text-align: center;">Haga clic en una mesa para<br>abrir o gestionar el pedido</p>
            </div>

            <div id="comanda-activa" class="hidden" style="flex: 1; display: flex; flex-direction: column;">
                <div id="lista-platos-comanda" style="flex: 1; overflow-y: auto; margin-bottom: 20px; padding-right: 5px;"></div>

                <div style="background: var(--hotel-blue); color: white; padding: 25px; border-radius: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(26,54,93,0.3);">
                    <small style="opacity: 0.7; font-weight: 800; text-transform: uppercase; font-size: 0.6rem;">Total de la Cuenta</small>
                    <h2 id="ui-total-comanda" style="font-size: 2.5rem; margin: 5px 0;">$0.00</h2>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <button class="btn-neo" style="justify-content: center; padding: 15px;" onclick="RestauranteModule.abrirBuscadorPlatos()">
                        <i class="fas fa-plus-circle"></i> AGREGAR
                    </button>
                    <button class="btn-neo btn-save" style="justify-content: center; padding: 15px;" onclick="RestauranteModule.finalizarCuenta()">
                        <i class="fas fa-cash-register"></i> COBRAR
                    </button>
                </div>

                <button class="btn-neo" style="background: var(--hotel-danger); color: white; justify-content: center; padding: 15px; margin-top: 15px; width: 100%; font-weight: 800;" onclick="RestauranteModule.anularComandaActiva()">
                    <i class="fas fa-ban"></i> ANULAR / RESETEAR MESA
                </button>
            </div>
        </div>
    </div>
</div>

<div id="modalMesa" class="modal-neo hidden">
    <div class="modal-content-neo animate__animated animate__zoomIn" style="width: 400px;">
        <h3 style="color: var(--hotel-blue); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-gold); padding-bottom: 15px;">CONFIGURACIÓN DE MESA</h3>
        
        <form id="formMesa">
            <input type="hidden" id="in-mesa-id">
            
            <label class="label-hint">Identificador / Número de Mesa</label>
            <input type="text" id="in-mesa-nro" class="input-neo" placeholder="Ej: MESA 01, VIP 1" required>
            
            <label class="label-hint">Capacidad (Personas)</label>
            <input type="number" id="in-mesa-capacidad" class="input-neo" min="1" value="2" required>
            
            <div class="modal-actions" style="flex-direction: column; gap: 15px; margin-top: 25px;">
                <div style="display: flex; gap: 15px;">
                    <button type="button" class="btn-neo" style="flex: 1; justify-content: center;" onclick="RestauranteModule.cerrarModalMesa()">CANCELAR</button>
                    <button type="submit" class="btn-neo btn-save" style="flex: 1; justify-content: center;"><i class="fas fa-save"></i> GUARDAR</button>
                </div>
                
                <button type="button" id="btn-eliminar-mesa" class="btn-neo" style="background: var(--hotel-danger); color: white; justify-content: center; display: none;" onclick="RestauranteModule.eliminarMesa()">
                    <i class="fas fa-trash"></i> ELIMINAR MESA
                </button>
            </div>
        </form>
    </div>
</div>

<div id="modalPlatos" class="modal-neo hidden">
    <div class="modal-content-neo modal-wide animate__animated animate__zoomIn">
        <h3 style="color: var(--hotel-blue); text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--hotel-gold); padding-bottom: 15px;">AÑADIR A PEDIDO</h3>
        
        <div style="position: relative; margin-bottom: 10px;">
            <i class="fas fa-search" style="position: absolute; top: 18px; left: 20px; color: #718096;"></i>
            <input type="text" id="in-buscar-plato" class="input-neo" style="padding-left: 50px; margin-bottom: 0;" placeholder="Buscar plato, bebida o escanear barras...">
        </div>
        
        <div id="filtros-categorias" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; margin-bottom: 15px; scrollbar-width: none;"></div>
        
        <div id="grid-platos-pos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; max-height: 400px; overflow-y: auto; padding: 10px;"></div>

        <div class="modal-actions" style="margin-top: 25px;">
            <button class="btn-neo" style="flex: 1; justify-content: center;" onclick="document.getElementById('modalPlatos').classList.add('hidden')">VOLVER A MESAS</button>
        </div>
    </div>
</div>

<!-- PANEL COCINA DESKTOP -->
<div id="panel-cocina-desktop" class="modal-neo hidden">
    <div class="modal-content-neo modal-wide animate__animated animate__zoomIn" style="max-width:750px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:2px solid var(--hotel-gold); padding-bottom:15px;">
            <h3 style="color:var(--hotel-blue); margin:0; font-weight:900;"><i class="fas fa-fire" style="color:#e74c3c;"></i> MONITOR DE COCINA</h3>
            <div style="display:flex; align-items:center; gap:15px;">
                <span style="font-size:0.75rem; color:#718096;" id="cocina-ultima-actualizacion"></span>
                <button class="btn-neo" onclick="RestauranteModule.cargarDatosCocina()" style="padding:8px 15px; font-size:0.8rem;"><i class="fas fa-sync-alt"></i></button>
                <button class="btn-neo" onclick="document.getElementById('panel-cocina-desktop').classList.add('hidden')" style="padding:8px 15px; font-size:0.8rem; color:var(--hotel-danger);"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Resumen rápido -->
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin-bottom:20px;">
            <div style="background:var(--hotel-bg); border-radius:15px; padding:15px; text-align:center; box-shadow:4px 4px 8px #bebebe,-4px -4px 8px #fff; border-left:4px solid #e74c3c;">
                <div style="font-size:1.8rem; font-weight:900; color:#e74c3c;" id="cocina-count-solicitado">0</div>
                <div style="font-size:0.7rem; color:#718096; font-weight:700;">SOLICITADOS</div>
            </div>
            <div style="background:var(--hotel-bg); border-radius:15px; padding:15px; text-align:center; box-shadow:4px 4px 8px #bebebe,-4px -4px 8px #fff; border-left:4px solid #f39c12;">
                <div style="font-size:1.8rem; font-weight:900; color:#f39c12;" id="cocina-count-preparacion">0</div>
                <div style="font-size:0.7rem; color:#718096; font-weight:700;">EN PREPARACIÓN</div>
            </div>
            <div style="background:var(--hotel-bg); border-radius:15px; padding:15px; text-align:center; box-shadow:4px 4px 8px #bebebe,-4px -4px 8px #fff; border-left:4px solid #e74c3c;">
                <div style="font-size:1.8rem; font-weight:900; color:#e74c3c;" id="cocina-count-demorados">0</div>
                <div style="font-size:0.7rem; color:#718096; font-weight:700;">+15 MIN (ALERTA)</div>
            </div>
        </div>

        <!-- Lista de pedidos -->
        <div id="cocina-lista-desktop" style="max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;">
            <p style="text-align:center; opacity:0.4;">Cargando...</p>
        </div>
    </div>
</div>
